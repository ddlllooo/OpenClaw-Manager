services:
  manager:
    image: ${MANAGER_IMAGE:-openclaw-manager:2026.10.15-container1}
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5}
        DOCKER_CLI_IMAGE: ${DOCKER_CLI_IMAGE:-docker:29-cli@sha256:1a4c7cb63513f349bdad01fcc6e0f3f2f67d37b9da86f14dc0d4a0942eecda00}
    container_name: ${MANAGER_CONTAINER:-openclaw-manager}
    init: true
    user: "${MANAGER_UID:-501}:${MANAGER_GID:-20}"
    restart: ${MANAGER_RESTART_POLICY:-unless-stopped}
    network_mode: bridge
    ports:
      - "127.0.0.1:${MANAGER_PORT:-18080}:${MANAGER_PORT:-18080}"
    environment:
      OPENCLAW_ENV_FILE: /run/openclaw-manager.env
      OPENCLAW_CONTROL_SOCKET: /run/openclaw-docker/control.sock
      MANAGER_PORT: ${MANAGER_PORT:-18080}
      OPENCLAW_AGENT_POLICY: ${OPENCLAW_AGENT_POLICY:-compatible}
      OPENCLAW_INSTANCE_EGRESS: ${OPENCLAW_INSTANCE_EGRESS:-compatible}
      MANAGER_AUTH_TOKEN: ${MANAGER_AUTH_TOKEN:-}
      MANAGER_MODEL_HTTP_ORIGINS: ${MANAGER_MODEL_HTTP_ORIGINS:-}
      MANAGER_PLUGIN_ALLOWLIST: ${MANAGER_PLUGIN_ALLOWLIST:-}
      MANAGER_NATIVE_PLUGIN_ALLOWLIST: ${MANAGER_NATIVE_PLUGIN_ALLOWLIST:-}
      # Container-only listener; do not publish this port to the host/LAN.
      OPENCLAW_CHANNEL_BRIDGE_LISTEN: ${OPENCLAW_CHANNEL_BRIDGE_LISTEN:-0.0.0.0:18081}
      OPENCLAW_DEVICE_NAME: ${MANAGER_DEVICE_NAME:-}
      OPENCLAW_PREVIOUS_MANAGER_IMAGE: ${MANAGER_PREVIOUS_IMAGE:-}
      OPENCLAW_DATA_DIR: ${MANAGER_DATA_HOME:?set absolute MANAGER_DATA_HOME}/instances
      OPENCLAW_STARTUP_HOME: ${MANAGER_DATA_HOME}/
      OPENCLAW_HOST_CONTROL_DIR: /run/openclaw-control
      OPENCLAW_BACKUP_DIR: ${MANAGER_BACKUP_DIR:?set absolute MANAGER_BACKUP_DIR}
      OPENCLAW_INSTANCE_USER: ${OPENCLAW_INSTANCE_USER:-}
    volumes:
      # Private runtime configuration; excluded from the image and source archive.
      - type: bind
        source: ./.env
        target: /run/openclaw-manager.env
        read_only: true
        bind:
          create_host_path: false
      # Preserve host paths: sibling instance bind mounts use these exact paths.
      - type: bind
        source: ${MANAGER_DATA_HOME}
        target: ${MANAGER_DATA_HOME}
        bind:
          create_host_path: false
      - type: bind
        source: ${MANAGER_CONTROL_DIR:?set absolute MANAGER_CONTROL_DIR}
        target: /run/openclaw-control
        bind:
          create_host_path: false
      - docker-control:/run/openclaw-docker:ro
    depends_on:
      docker-control:
        condition: service_healthy
    labels:
      openclaw.manager: "true"
      openclaw.deployment: ${MANAGER_DEPLOYMENT:?set unique MANAGER_DEPLOYMENT}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.75
    mem_limit: 512m
    pids_limit: 128
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  docker-control:
    image: ${MANAGER_IMAGE:-openclaw-manager:2026.10.15-container1}
    command: ["node", "scripts/docker-control.cjs"]
    user: "0:0"
    restart: unless-stopped
    network_mode: none
    environment:
      OPENCLAW_DATA_DIR: ${MANAGER_DATA_HOME}/instances
      OPENCLAW_CONTROL_SOCKET: /run/openclaw-docker/control.sock
      OPENCLAW_DOCKER_SOCKET: /var/run/docker.sock
      OPENCLAW_CONTROL_SOCKET_MODE: "666"
      OPENCLAW_CONTROL_DEPLOYMENT: ${MANAGER_DEPLOYMENT}
      OPENCLAW_CONTROL_MANAGER: ${MANAGER_CONTAINER:-openclaw-manager}
    volumes:
      - ${DOCKER_SOCKET_HOST}:/var/run/docker.sock
      - ${MANAGER_DATA_HOME}:${MANAGER_DATA_HOME}:ro
      - docker-control:/run/openclaw-docker
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({socketPath:'/run/openclaw-docker/control.sock',path:'/_ping'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  docker-control:
